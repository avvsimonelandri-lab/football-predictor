# Costruisce FootballPredictorPro.exe su un PC Windows di GitHub e lo pubblica come "release".
# Si avvia da solo quando cambia version.py (nuova versione), oppure a mano da "Actions".
# Il numero di versione è quello scritto in version.py; tag e release vengono creati qui.
# Il programma installato sui PC controlla le release e si aggiorna da solo.
name: Crea programma Windows

on:
  push:
    branches: [main]
    paths: ["version.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-programma
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Numero di versione
        id: ver
        shell: bash
        run: echo "v=$(python -c 'from version import VERSION; print(VERSION)')" >> "$GITHUB_OUTPUT"

      - name: Librerie
        run: pip install -r requirements.txt pyinstaller

      - name: Crea exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name FootballPredictorPro --collect-data customtkinter app.py

      - name: Prova di avvio (aggiornamento dati senza finestra)
        shell: bash
        run: |
          timeout 600 ./dist/FootballPredictorPro.exe --update || true
          echo "--- registro ---"; cat dist/dati/aggiornamenti.log || true
          test -s dist/dati/football_data.json

      - name: Pubblica la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Versione ${{ steps.ver.outputs.v }}
          files: dist/FootballPredictorPro.exe
          generate_release_notes: true
          make_latest: true

      - name: Exe scaricabile anche dalla pagina Actions
        uses: actions/upload-artifact@v4
        with:
          name: FootballPredictorPro
          path: dist/FootballPredictorPro.exe
