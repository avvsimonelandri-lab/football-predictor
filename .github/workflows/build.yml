# Costruisce FootballPredictorPro.exe su un PC Windows di GitHub e lo pubblica come "release".
# Si avvia da solo quando si carica un tag di versione (es. v2.3), quando si pubblica una release
# dal sito, oppure a mano da "Actions". Se la release non esiste, viene creata.
# Il programma installato sui PC controlla le release e si aggiorna da solo.
name: Crea programma Windows

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Numero di versione dal tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "VERSION = \"${GITHUB_REF_NAME#v}\"" > version.py

      - name: Librerie
        run: pip install -r requirements.txt pyinstaller

      - name: Crea exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name FootballPredictorPro --collect-data customtkinter app.py

      - name: Pubblica la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FootballPredictorPro.exe
          name: Versione ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true

      - name: Exe scaricabile anche dalla pagina Actions
        uses: actions/upload-artifact@v4
        with:
          name: FootballPredictorPro
          path: dist/FootballPredictorPro.exe
