# Aggiorna la versione per telefono (GitHub Pages) ogni 4 ore, anche con il PC spento.
# Salva nel repository solo lo storico dei pronostici (state/storico.json).
name: Pagina telefono

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["*.py", "web/**", ".github/workflows/site.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pagina-telefono
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Librerie
        run: pip install numpy scipy certifi

      - name: Scarica dati e crea la pagina
        env:
          FDORG_KEY: ${{ secrets.FDORG_KEY }}
        run: python web/build_site.py

      - name: Salva lo storico pronostici
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/storico.json
          git diff --cached --quiet || (git commit -m "Storico pronostici $(date -u +%F' '%H:%M)" && git pull --rebase && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
